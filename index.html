<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duelo de Figuritas - Edición Batalla 2D</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#14101c;--paper:#f3efe6;--gold:#ffc928;--hp-green:#4cd964;--hp-yellow:#ffcc00;--hp-red:#ff3b30}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;color:var(--paper);background:repeating-linear-gradient(135deg,#1e1338 0 18px,#261947 18px 36px);padding:12px;display:flex;justify-content:center}
main{width:100%;max-width:960px}
h1{font:1.6rem 'Russo One',Impact,sans-serif;margin:4px 0 8px;color:var(--gold);text-shadow:2px 2px 0 #000}
h2{font:1.15rem 'Russo One',sans-serif;margin:6px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:10px}
.fig{--c1:#f2a81d;--c2:#e8870c;position:relative;aspect-ratio:1.9;height:auto;max-width:320px;margin:0 auto;border-radius:10px;background:linear-gradient(115deg,var(--c1),var(--c2));overflow:hidden;color:#fff;border:0;padding:0;text-align:left;font:inherit;width:100%;box-shadow:0 3px 0 #0006}
.fig:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,#fff2 0 10px,#fff0 10px 22px)}
button.fig{cursor:pointer;transition:transform .15s}
button.fig:hover:not(:disabled),button.fig:focus-visible{outline:3px solid var(--gold);transform:translateY(-2px)}
button.fig:disabled{opacity:.3;cursor:not-allowed}
.oval{position:absolute;left:8px;top:8px;height:74%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 30%,#fff,#e9dfe9 70%);display:flex;align-items:center;justify-content:center;overflow:hidden}
.oval img{width:92%;height:92%;object-fit:contain}
.oval b{font:2rem 'Russo One',sans-serif;color:#0003}
.tag{position:absolute;left:0;bottom:8px;background:var(--ink);color:#fff;font:.82rem 'Russo One',sans-serif;padding:4px 14px 4px 10px;border-radius:0 12px 0 0;text-transform:uppercase;max-width:60%}
.info{position:absolute;right:8px;top:28px;width:48%;font-size:.62rem;line-height:1.1;text-shadow:0 1px 0 #0006}
.info div{margin-bottom:4px}.info span{display:block;font-weight:800;font-size:.74rem}
.brand{position:absolute;right:8px;top:6px;font:italic .8rem 'Russo One',sans-serif;color:#fff;text-shadow:1px 1px 0 #1a4db0,-1px -1px 0 #1a4db0,1px -1px 0 #1a4db0,-1px 1px 0 #1a4db0}
.fire{--c1:#ee4a2a;--c2:#c42a14}.water{--c1:#35a0e6;--c2:#1f74c4}.grass{--c1:#46b052;--c2:#2a8a3a}.poison{--c1:#9a4cc4;--c2:#6e2a98}.psy{--c1:#e8508f;--c2:#c42a72}.bug{--c1:#f08a2a;--c2:#d4620e}
.cback{background:repeating-linear-gradient(135deg,#2b2160 0 12px,#35287a 12px 24px);border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px}
.cback:before{display:none}
button.cback:disabled{opacity:.6}
.ball{width:34px;height:34px;border-radius:50%;background:linear-gradient(#e33 0 46%,#111 46% 54%,#fff 54%);border:3px solid #111}
.bt{font:italic .9rem 'Russo One',sans-serif;color:var(--gold)}
.own{position:absolute;right:6px;bottom:6px;background:var(--gold);color:var(--ink);font:.7rem 'Russo One',sans-serif;padding:2px 8px;border-radius:6px}
.flip{animation:fl .6s both}
@keyframes fl{from{transform:rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
.bench{margin-top:6px;font-size:.85rem;opacity:.95;background:#0004;padding:6px 10px;border-radius:8px;border:1px solid #ffffff1a}
.lead{outline:4px solid var(--gold)}

/* ---- ESTILOS LOBBY Y MENÚS ---- */
.box{background:#0004;border-radius:12px;padding:12px;margin-bottom:12px;border:1px solid #ffffff15}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.9rem;margin-bottom:8px}
.fld input,.fld select{font:1rem system-ui,sans-serif;padding:8px 10px;border-radius:8px;border:2px solid var(--gold);background:#fff;color:var(--ink);width:190px}
button.b{font:.95rem 'Russo One',sans-serif;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;background:var(--gold);color:var(--ink);box-shadow:0 3px 0 #0007;transition:transform .1s,filter .1s}
button.b:hover:not(:disabled){filter:brightness(1.1)}
button.b:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #0007}
button.b:disabled{opacity:.35;cursor:not-allowed}
button.b.sp{background:#ff5a3c;color:#fff}
button.b.evo{background:#9a4cc4;color:#fff}
button.b.sm{padding:6px 10px;font-size:.8rem;background:#fff3;color:#fff;box-shadow:none}
button.b.sm.on{background:var(--gold);color:var(--ink)}
.top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.top h1{margin:0;flex:1;font-size:clamp(1.1rem,5.5vw,1.6rem)}
.rules{font-size:.85rem;opacity:.9;line-height:1.4}
.hide{display:none!important}

/* ---- ARENA 2D VISUAL DE COMBATE ---- */
.arena-2d-container{position:relative;width:100%;background:#090614;border-radius:16px;border:3px solid var(--gold);overflow:hidden;box-shadow:0 12px 30px #0009;margin-bottom:10px}
.stage-2d{position:relative;width:100%;height:320px;overflow:hidden;background-size:cover;background-position:center;transition:background-image 0.8s ease}

/* Fondos por elemento */
.bg-grass{background-image:linear-gradient(to bottom, #1d4e89 0%, #388e3c 60%, #1b5e20 100%)}
.bg-fire{background-image:linear-gradient(to bottom, #4a148c 0%, #d84315 65%, #bf360c 100%)}
.bg-water{background-image:linear-gradient(to bottom, #0d47a1 0%, #0288d1 60%, #01579b 100%)}
.bg-poison{background-image:linear-gradient(to bottom, #311b92 0%, #7b1fa2 65%, #4a148c 100%)}
.bg-psy{background-image:linear-gradient(to bottom, #4a148c 0%, #c2185b 65%, #880e4f 100%)}
.bg-bug{background-image:linear-gradient(to bottom, #2e7d32 0%, #689f38 65%, #33691e 100%)}
.bg-default{background-image:linear-gradient(to bottom, #263238 0%, #455a64 65%, #1c313a 100%)}

/* Decoración del escenario 2D (Suelo/Plataformas) */
.stage-floor{position:absolute;bottom:0;left:0;width:100%;height:45%;background:radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.15) 0%, rgba(0,0,0,0.6) 80%);border-top:2px solid rgba(255,255,255,0.2)}
.platform{position:absolute;border-radius:50%;background:rgba(0,0,0,0.35);border:2px solid rgba(255,255,255,0.25);box-shadow:0 6px 16px #0008;transform:scaleY(0.4)}
.platform-player{bottom:15px;left:10%;width:180px;height:90px}
.platform-foe{top:65px;right:10%;width:160px;height:80px}

/* Sprites de Personajes en Escenario */
.sprite-holder{position:absolute;display:flex;justify-content:center;align-items:flex-end;pointer-events:none;transition:transform .2s ease-out}
.holder-player{bottom:35px;left:12%;z-index:10;width:150px;height:150px}
.holder-foe{top:20px;right:12%;z-index:5;width:130px;height:130px}

.pkmn-sprite{max-width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 8px 6px rgba(0,0,0,0.6))}
.sprite-player-img{transform:scale(1.4)}
.sprite-foe-img{transform:scale(1.2)}

/* Animaciones de Combate 2D */
.anim-atk-player{animation:atkPlayer .4s ease-in-out}
.anim-atk-foe{animation:atkFoe .4s ease-in-out}
@keyframes atkPlayer{0%{transform:translate(0,0)}50%{transform:translate(40px,-30px) scale(1.15)}100%{transform:translate(0,0)}}
@keyframes atkFoe{0%{transform:translate(0,0)}50%{transform:translate(-40px,30px) scale(1.15)}100%{transform:translate(0,0)}}

.anim-hit{animation:hitShake .4s ease-in-out;filter:brightness(2) drop-shadow(0 0 10px #f00)!important}
@keyframes hitShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}

.anim-evo{animation:evoGlow .8s ease-in-out}
@keyframes evoGlow{0%{filter:brightness(1)}50%{filter:brightness(5) drop-shadow(0 0 25px #ffc928)}100%{filter:brightness(1)}}

/* Proyectiles Visuales */
.fx-projectile{position:absolute;z-index:20;width:40px;height:40px;border-radius:50%;pointer-events:none;opacity:0}
.fx-fire{background:radial-gradient(circle, #fff, #ff5722, #b71c1c);box-shadow:0 0 20px #ff5722}
.fx-water{background:radial-gradient(circle, #fff, #03a9f4, #01579b);box-shadow:0 0 20px #03a9f4}
.fx-grass{background:radial-gradient(circle, #fff, #8bc34a, #1b5e20);box-shadow:0 0 20px #8bc34a}
.fx-elec{background:radial-gradient(circle, #fff, #ffeb3b, #f57f17);box-shadow:0 0 20px #ffeb3b}
.fx-phys{background:radial-gradient(circle, #fff, #eee, #9e9e9e);box-shadow:0 0 15px #fff}

@keyframes flyToFoe{0%{left:20%;bottom:60px;opacity:1;transform:scale(.6)}100%{left:75%;bottom:190px;opacity:1;transform:scale(1.3)}}
@keyframes flyToPlayer{0%{left:75%;bottom:190px;opacity:1;transform:scale(.6)}100%{left:20%;bottom:60px;opacity:1;transform:scale(1.3)}}

/* Damage Floating Popups */
.damage-popup{position:absolute;font:2rem 'Press Start 2P','Russo One',sans-serif;color:#ff3b30;text-shadow:3px 3px 0 #000, -2px -2px 0 #000;z-index:30;pointer-events:none;animation:floatDmg .8s ease-out forwards}
@keyframes floatDmg{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1;transform:translateY(-20px) scale(1.2)}100%{opacity:0;transform:translateY(-50px) scale(1)}}

/* HUD / Tarjetas de Vida RPG en Escenario */
.hud-card{position:absolute;background:rgba(20, 16, 28, 0.85);border:2px solid var(--gold);border-radius:12px;padding:8px 12px;width:240px;box-shadow:0 4px 12px #0008;z-index:15;backdrop-filter:blur(4px)}
.hud-player{bottom:15px;right:15px}
.hud-foe{top:15px;left:15px}
.hud-name{font:0.9rem 'Russo One',sans-serif;color:#fff;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.hud-level{font-size:0.75rem;color:var(--gold)}
.hud-hp-bg{height:12px;background:#222;border-radius:6px;overflow:hidden;border:1px solid #444;position:relative}
.hud-hp-fill{height:100%;width:100%;background:var(--hp-green);transition:width .5s ease, background-color .5s ease}
.hud-hp-num{font-size:0.72rem;text-align:right;margin-top:2px;font-weight:700}
.hud-energy{display:flex;gap:4px;margin-top:4px;align-items:center}
.hud-energy-title{font-size:0.65rem;opacity:.8;margin-right:2px}
.energy-orb{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,var(--gold) 55%,#b8860b);box-shadow:0 0 6px var(--gold)}
.energy-orb.off{background:#444;box-shadow:none;opacity:.4}

/* Chat & Log Styles */
.chat{position:fixed;bottom:52px;right:10px;width:min(340px,calc(100vw - 20px));height:min(330px,55vh);background:#1b1230f2;border:2px solid var(--gold);border-radius:12px;z-index:60;display:flex;flex-direction:column;padding:8px;gap:6px}
.chatlog{flex:1;overflow-y:auto;font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.msg{padding:5px 9px;border-radius:10px;background:#fff2;max-width:85%;overflow-wrap:anywhere;align-self:flex-start}
.msg.me{background:var(--gold);color:var(--ink);align-self:flex-end}
.msg b{display:block;font-size:.72rem;opacity:.75}
.quick{display:flex;gap:6px}.quick button{background:#fff2;border:0;border-radius:8px;font-size:1.1rem;cursor:pointer;padding:2px 9px}
.chatin{display:flex;gap:6px}.chatin input{flex:1;min-width:0;font:.95rem system-ui,sans-serif;padding:7px 9px;border-radius:8px;border:2px solid var(--gold)}
.badge{background:#e23;color:#fff;border-radius:10px;padding:0 6px;margin-left:4px}
.log{background:#0005;border-radius:8px;padding:8px 12px;min-height:3.8em;font-size:.9rem;border:1px solid #ffffff1a}
.log div:first-child{font-weight:700;color:var(--gold)}
.die{width:64px;height:64px;border-radius:14px;background:var(--paper);color:var(--ink);font:2.2rem 'Russo One',sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #0007}
.die.go{animation:t .4s}@keyframes t{0%{transform:rotate(-40deg) scale(.6)}100%{transform:none}}
.mid-controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:8px;background:#0003;border-radius:12px}

@media (max-width:719px){
  .stage-2d{height:250px}
  .holder-player{width:110px;height:110px;bottom:25px;left:8%}
  .holder-foe{width:95px;height:95px;top:15px;right:8%}
  .hud-card{width:160px;padding:6px 8px}
  .hud-name{font-size:0.75rem}
  .hud-hp-num{font-size:0.65rem}
  .hud-player{bottom:8px;right:8px}
  .hud-foe{top:8px;left:8px}
  .mid-controls{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .die{grid-column:1/-1;justify-self:center;width:50px;height:50px;font-size:1.6rem}
}
</style>
</head>
<body>
<main>
<header class="top">
  <h1>Duelo de Figuritas 2D</h1>
  <button class="b sm hide" id="menuBtn">⬅ Menú</button>
  <button class="b sm hide" id="chatTog" aria-expanded="false">💬 Chat<span class="badge hide" id="chatBadge">0</span></button>
  <button class="b sm" id="muteBtn" aria-label="Silenciar sonidos">🔊</button>
</header>

<section id="lobby">
  <div class="box">
    <label class="fld">Tu nombre<input id="myname" maxlength="14" placeholder="Tu nombre" autocomplete="off" list="known"><datalist id="known"></datalist></label>
    <label class="fld">Tiempo por turno<select id="limit"><option value="0">Sin límite</option><option value="20">20 segundos</option><option value="30">30 segundos</option><option value="45" selected>45 segundos</option><option value="60">60 segundos</option></select></label>
    <label class="fld">Formato<select id="fmt"><option value="ffa2">1 contra 1</option><option value="ffa3">Todos contra todos: 3 jugadores</option><option value="ffa4">Todos contra todos: 4 jugadores</option><option value="team">2 contra 2 (equipos)</option></select></label>
  </div>
  <div class="box">
    <h2>🎮 Modo de Juego</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
      <button class="b" id="botBtn">VS Compu</button>
      <button class="b" id="advBtn">🗺 Modo Aventura</button>
      <button class="b" id="localBtn">Pantalla Compartida</button>
    </div>
  </div>
  <div class="box">
    <h2>🌐 Multijugador Online</h2>
    <p><button class="b" id="openBtn">⚡ Crear sala abierta (15 s)</button></p>
    <h2 style="font-size:1rem">Salas abiertas ahora</h2>
    <div id="rooms" class="rules">Buscando salas…</div>
    <h2 style="font-size:1rem;margin-top:14px">Sala privada</h2>
    <p><button class="b" id="hostBtn">Crear sala con código</button></p>
    <label class="fld">Código<input id="code" maxlength="4" placeholder="K7QP" autocomplete="off"></label>
    <p><button class="b" id="joinBtn">Unirme a sala</button></p>
    <p class="rules" id="netmsg" aria-live="polite"></p>
  </div>
  <div class="box">
    <h2>🏆 Ranking Top 10</h2>
    <div id="rank" class="rules"></div>
    <button class="b sm" id="rankRefresh" style="margin-top:6px">🔄 Actualizar</button>
  </div>
</section>

<section id="pick" class="hide">
  <div class="names" id="names"></div>
  <h2 id="pt"></h2>
  <div class="grid" id="grid"></div>
</section>

<section id="reveal" class="hide">
  <div id="rv"></div>
</section>

<!-- ESCENARIO DE BATALLA 2D INTERACTIVO -->
<section id="game" class="hide">
  <div class="banner" id="banner" style="text-align:center;font:1.1rem 'Russo One',sans-serif;color:var(--gold);margin-bottom:8px"></div>
  
  <div class="arena-2d-container">
    <div class="stage-2d bg-default" id="stage2d">
      <div class="stage-floor"></div>
      
      <!-- Plataformas de Combate -->
      <div class="platform platform-player"></div>
      <div class="platform platform-foe"></div>
      
      <!-- Sprites 2D Animados de Personajes -->
      <div class="sprite-holder holder-player" id="holderPlayer">
        <img id="spritePlayer" class="pkmn-sprite sprite-player-img" src="" alt="Player Pokemon">
      </div>
      <div class="sprite-holder holder-foe" id="holderFoe">
        <img id="spriteFoe" class="pkmn-sprite sprite-foe-img" src="" alt="Foe Pokemon">
      </div>
      
      <!-- Proyectil Visual Animado -->
      <div class="fx-projectile" id="fxProjectile"></div>

      <!-- HUD RPG Jugador Local (Abajo Derecha) -->
      <div class="hud-card hud-player" id="hudPlayer">
        <div class="hud-name"><span id="hudPlayerName">--</span> <span class="hud-level" id="hudPlayerSt">--</span></div>
        <div class="hud-hp-bg"><div class="hud-hp-fill" id="hudPlayerHpFill"></div></div>
        <div class="hud-hp-num" id="hudPlayerHpNum">0/0 HP</div>
        <div class="hud-energy">
          <span class="hud-energy-title">Energía:</span>
          <div id="hudPlayerOrbs" style="display:flex;gap:3px"></div>
        </div>
      </div>

      <!-- HUD RPG Rival (Arriba Izquierda) -->
      <div class="hud-card hud-foe" id="hudFoe">
        <div class="hud-name"><span id="hudFoeName">--</span> <span class="hud-level" id="hudFoeSt">--</span></div>
        <div class="hud-hp-bg"><div class="hud-hp-fill" id="hudFoeHpFill"></div></div>
        <div class="hud-hp-num" id="hudFoeHpNum">0/0 HP</div>
        <div class="hud-energy">
          <span class="hud-energy-title">Energía:</span>
          <div id="hudFoeOrbs" style="display:flex;gap:3px"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Controles y Acciones -->
  <div class="mid-controls">
    <div class="die" id="die">?</div>
    <button class="b" id="rollBtn">Tirar dado</button>
    <button class="b" id="stoneBtn">Canjear 6 pts (1 Piedra)</button>
    <button class="b evo" id="evoBtn">Evolucionar (2 Piedras)</button>
    <button class="b" id="atkBtn">Ataque Básico</button>
    <button class="b sp" id="spBtn">Ataque Especial</button>
    <button class="b" id="swapBtn">Cambiar Monstruo</button>
    <button class="b" id="keepBtn">Terminar turno</button>
  </div>

  <div class="bench" id="benchView" style="margin-top:8px"></div>
  <div class="log" id="log" style="margin-top:8px" aria-live="polite"></div>
  <button class="b hide" id="again" style="margin-top:10px;width:100%">Nueva partida</button>
</section>

<div class="chat hide" id="chatBox">
  <div class="chatlog" id="chatLog"></div>
  <div class="quick"><button data-q="👍">👍</button><button data-q="😂">😂</button><button data-q="😮">😮</button><button data-q="👏">👏</button><button data-q="🔥">🔥</button></div>
  <div class="chatin"><input id="chatIn" maxlength="200" placeholder="Mensaje…"><button class="b sm" id="chatSend">Enviar</button></div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// Base de datos de Pokémon
const D=`1|Bulbasaur|Planta/Veneno|g|1|b|Látigo cepa|Rayo solar
2|Ivysaur|Planta/Veneno|g|2|b|Hoja afilada|Rayo solar
3|Venusaur|Planta/Veneno|g|3|t|Hoja afilada|Rayo solar
4|Charmander|Fuego|f|1|a|Ascuas|Lanzallamas
5|Charmeleon|Fuego|f|2|a|Colmillo ígneo|Lanzallamas
6|Charizard|Fuego/Volador|f|3|a|Garra dragón|Llamarada
7|Squirtle|Agua|w|1|t|Burbuja|Hidrobomba
8|Wartortle|Agua|w|2|t|Mordisco|Hidrobomba
9|Blastoise|Agua|w|3|t|Cañón de agua|Hidrobomba
13|Weedle|Bicho/Veneno|b|1|b|Picotazo|Doble ataque
14|Kakuna|Bicho/Veneno|b|2|t|Fortaleza|Picadura
15|Beedrill|Bicho/Veneno|b|3|a|Doble aguijón|Taladradora
16|Pidgey|Normal/Volador|e|1|b|Tornado|Ataque ala
17|Pidgeotto|Normal/Volador|e|2|b|Ataque ala|Ataque aéreo
18|Pidgeot|Normal/Volador|e|3|a|Ataque ala|Pájaro osado
172|Pichu|Eléctrico|e|1|b|Chispa|Impactrueno
25|Pikachu|Eléctrico|e|2|a|Impactrueno|Rayo trueno
26|Raichu|Eléctrico|e|3|a|Puño trueno|Trueno
29|Nidoran♀|Veneno|p|1|b|Arañazo|Mordisco
30|Nidorina|Veneno|p|2|t|Mordisco|Doble patada
31|Nidoqueen|Veneno/Tierra|p|3|t|Doble patada|Terremoto

const EVOLUTIONS = {
  1:2, 2:3, 4:5, 5:6, 7:8, 8:9, 13:14, 14:15, 16:17, 17:18, 172:25, 25:26,
  29:30, 30:31, 32:33, 33:34, 37:38, 58:59, 63:64, 64:65, 66:67, 67:68,
  74:75, 75:76, 92:93, 93:94, 95:208, 129:130, 133:134, 147:148, 148:149
};

const B={1:{hp:55,b:13,s:28},2:{hp:75,b:18,s:40},3:{hp:100,b:26,s:58},L:{hp:90,b:24,s:72}};
const R={a:[.88,1.15],t:[1.15,.88],b:[1,1],k:[1.5,.9],l:[1,1],j:[.8,.5]};
const C={g:'grass',f:'fire',w:'water',p:'poison',y:'psy',b:'bug',e:'default'};

const M=D.split('\n').map(l=>{const [id,n,el,c,st,r,a1,a2]=l.split('|'),s=B[st],[h,d]=R[r];
  return{id:+id,n,el,cl:C[c]||'default',st,a1,a2,hp:Math.round(s.hp*h/5)*5,b:Math.round(s.b*d),s:Math.round(s.s*d)}});
const MAP_M = {}; M.forEach(m => MAP_M[m.id] = m);

const $=id=>document.getElementById(id),rnd=()=>1+Math.floor(Math.random()*6),wait=ms=>new Promise(r=>setTimeout(r,ms));

// URLs para Sprites 2D Animados Oficiales (Gen V Black/White)
const SPRITE_ANIM_FRONT = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/';
const SPRITE_ANIM_BACK = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/back/';
const SPRITE_STATIC_FRONT = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/';
const SPRITE_STATIC_BACK = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/back/';

// Funciones para cargar sprites con fallback seguro si la animación no existe
function setSpriteUrl(imgEl, id, isBack) {
  const animUrl = (isBack ? SPRITE_ANIM_BACK : SPRITE_ANIM_FRONT) + id + '.gif';
  const staticUrl = (isBack ? SPRITE_STATIC_BACK : SPRITE_STATIC_FRONT) + id + '.png';
  imgEl.onerror = () => { imgEl.onerror = null; imgEl.src = staticUrl; };
  imgEl.src = animUrl;
}

let P,G=null,phase='lobby',ME=null,NET={role:null,conn:null,conns:[],hi:[],peer:null},N=2,TEAM=false,TG=-1,lastRoll=-1,lastEv=0,rvPeek=false,rvFresh=false,peekK=null,BOT=false,botPending=false;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Sonidos Sintentizados
let AC=null,MUTE=false;
const ac=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC};
function tone(f,t,d,type,v,f2){const c=ac();if(!c||MUTE)return;const T=c.currentTime+t,o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,T);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+d);g.gain.setValueAtTime(v||.15,T);g.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(g);g.connect(c.destination);o.start(T);o.stop(T+d+.02)}
function noise(t,d,v,fc){const c=ac();if(!c||MUTE)return;const T=c.currentTime+t,n=Math.max(1,Math.floor(c.sampleRate*d)),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=fc||1000;g.gain.setValueAtTime(v||.2,T);g.gain.exponentialRampToValueAtTime(.001,T+d);s.connect(f);f.connect(g);g.connect(c.destination);s.start(T)}
const SFX={
 roll(){for(let i=0;i<6;i++)tone(200+Math.random()*300,i*.06,.04,'square',.04)},
 six(){[660,880,1320].forEach((f,i)=>tone(f,.1+i*.08,.2,'triangle',.18))},
 atk(){noise(0,.18,.5,1600);tone(170,0,.22,'sawtooth',.18,60)},
 sp(){tone(90,0,.55,'sawtooth',.28,30);noise(0,.4,.5,800)},
 ko(){tone(300,0,.6,'sawtooth',.2,40)},
 win(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.3,'triangle',.15))},
 evo(){[440,554,659,880,1108].forEach((f,i)=>tone(f,i*.08,.2,'triangle',.15))}
};
const play=t=>{if(SFX[t])SFX[t]()};

const NAMES=['Jugador 1','Jugador 2'];
const nm=k=>esc(NAMES[k]),took=k=>P.pool.filter(c=>c.o===k).length;
const nextPick=()=>{for(let k=0;k<N;k++)if(took(k)<2)return k;return 0};
function setFmt(v){v=v||$('fmt').value;TEAM=v==='team';N=TEAM?4:+v.slice(3);NAMES.length=0;for(let k=0;k<N;k++)NAMES.push('Jugador '+(k+1));$('names').innerHTML=''}
const foes=k=>G.pl.map((_,j)=>j).filter(j=>j!==k&&!G.pl[j].dead&&(!TEAM||j%2!==k%2));
const tgt=()=>{const f=foes(G.turn);return f.includes(TG)?TG:f[0]};

function show(id){['lobby','pick','reveal','game'].forEach(i=>$(i).classList.toggle('hide',i!==id));$('menuBtn').classList.toggle('hide',id==='lobby')}

// Lógica de Selección y Revelación
function newPick(){
  phase='pick';show('pick');
  P={pool:shuffle(M.map((_,i)=>i)).slice(0,12).map(mi=>({mi,o:null})),lead:Array(N).fill(0),ready:Array(N).fill(false)};
  renderPick();
}
function renderPick(){
  $('names').classList.toggle('hide',!!NET.role||BOT);
  const k=nextPick(),mine=ME===null||k===ME;
  $('pt').innerHTML=mine?`${nm(k)}: tomá 2 figuritas boca abajo (${took(k)}/2)`:`Esperando que ${nm(k)} elija...`;
  $('grid').innerHTML=P.pool.map((c,i)=>`<button class="fig cback" data-i="${i}" ${c.o!==null||!mine?'disabled':''}><div class="ball"></div><div class="bt">Figurita #${i+1}</div>${c.o!==null?`<div class="own">${nm(c.o)}</div>`:''}</button>`).join('');
}
function reveal(){
  phase='reveal';show('reveal');
  const local=ME===null,k=local?Math.max(0,P.ready.indexOf(false)):ME;
  let h;
  if(P.ready[k])h=`<h2>${nm(k)}</h2><p class="rules">Listo. Esperando rivales...</p>`;
  else if(local&&!rvPeek)h=`<h2>${nm(k)}</h2><p class="rules">Pasale la pantalla a ${nm(k)}.</p><button class="b" id="peekBtn">Ver mis figuritas</button>`;
  else{
    const cs=P.pool.filter(c=>c.o===k);
    h=`<h2>${nm(k)}: Elige tu inicial</h2><div class="grid">${cs.map((c,i)=>`<button class="fig ${M[c.mi].cl}${i===P.lead[k]?' lead':''}" data-lead="${i}"><div class="tag">${M[c.mi].n}</div></button>`).join('')}</div><p><button class="b" id="readyBtn">Listo para pelear</button></p>`;
  }
  $('rv').innerHTML=h;
}
function startGame(){
  const mk=k=>{const cs=P.pool.filter(c=>c.o===k).map(c=>({m:M[c.mi],hp:M[c.mi].hp,max:M[c.mi].hp}));if(P.lead[k]===1)cs.reverse();return{mons:cs,a:0,t:0,pts:0,dead:false}};
  G={pl:NAMES.map((_,k)=>mk(k)),turn:0,rolled:false,bonus:false,extra:0,busy:false,over:false,die:0,log:[`${nm(0)} empieza la batalla.`]};
  phase='game';show('game');render();
}

const act=k=>G.pl[k].mons[G.pl[k].a],ben=k=>G.pl[k].mons[1-G.pl[k].a],cur=()=>act(G.turn);
function getNextEvo(m){const nextId=EVOLUTIONS[m.id];return nextId?MAP_M[nextId]:null}

/* ---- ACTUALIZACIÓN DE LA ARENA 2D VISUAL ---- */
function update2dArena(){
  if(!G) return;
  const pPlayerIndex = ME !== null ? ME : 0;
  const pFoeIndex = G.pl.findIndex((_, idx) => idx !== pPlayerIndex && !G.pl[idx].dead);
  const safeFoeIndex = pFoeIndex >= 0 ? pFoeIndex : (pPlayerIndex === 0 ? 1 : 0);

  const pMon = act(pPlayerIndex);
  const fMon = act(safeFoeIndex);

  // Escenario dinámico según elemento del jugador
  const stage = $('stage2d');
  stage.className = 'stage-2d bg-' + (pMon.m.cl || 'default');

  // Actualizar Sprites 2D (Player = Espalda / Foe = Frente)
  setSpriteUrl($('spritePlayer'), pMon.m.id, true);
  setSpriteUrl($('spriteFoe'), fMon.m.id, false);

  // HUD Jugador
  $('hudPlayerName').textContent = pMon.m.n;
  $('hudPlayerSt').textContent = 'Nv.' + (pMon.m.st==='L'?'★':pMon.m.st);
  const pHpPct = Math.max(0, (pMon.hp / pMon.max) * 100);
  const pHpFill = $('hudPlayerHpFill');
  pHpFill.style.width = pHpPct + '%';
  pHpFill.style.backgroundColor = pHpPct > 50 ? 'var(--hp-green)' : pHpPct > 20 ? 'var(--hp-yellow)' : 'var(--hp-red)';
  $('hudPlayerHpNum').textContent = `${pMon.hp}/${pMon.max} HP`;
  $('hudPlayerOrbs').innerHTML = [0,1,2,3].map(i=>`<div class="energy-orb ${G.pl[pPlayerIndex].t > i ? '' : 'off'}"></div>`).join('');

  // HUD Rival
  $('hudFoeName').textContent = fMon.m.n;
  $('hudFoeSt').textContent = 'Nv.' + (fMon.m.st==='L'?'★':fMon.m.st);
  const fHpPct = Math.max(0, (fMon.hp / fMon.max) * 100);
  const fHpFill = $('hudFoeHpFill');
  fHpFill.style.width = fHpPct + '%';
  fHpFill.style.backgroundColor = fHpPct > 50 ? 'var(--hp-green)' : fHpPct > 20 ? 'var(--hp-yellow)' : 'var(--hp-red)';
  $('hudFoeHpNum').textContent = `${fMon.hp}/${fMon.max} HP`;
  $('hudFoeOrbs').innerHTML = [0,1,2,3].map(i=>`<div class="energy-orb ${G.pl[safeFoeIndex].t > i ? '' : 'off'}"></div>`).join('');

  // Banco
  const bMon = ben(pPlayerIndex);
  $('benchView').innerHTML = `<b>Tu Banco:</b> ${bMon.m.n} (${bMon.hp}/${bMon.max} HP)`;
}

// Animaciones de Ataque y Daño en 2D
function triggerAttackAnimation(isPlayerAttacker, elementClass, dmg) {
  const attackerHolder = isPlayerAttacker ? $('holderPlayer') : $('holderFoe');
  const targetHolder = isPlayerAttacker ? $('holderFoe') : $('holderPlayer');
  const projectile = $('fxProjectile');

  // Animación Embestida
  attackerHolder.classList.remove('anim-atk-player', 'anim-atk-foe');
  void attackerHolder.offsetWidth;
  attackerHolder.classList.add(isPlayerAttacker ? 'anim-atk-player' : 'anim-atk-foe');

  // Proyectil Visual
  projectile.className = 'fx-projectile fx-' + (elementClass === 'fire' ? 'fire' : elementClass === 'water' ? 'water' : elementClass === 'grass' ? 'grass' : elementClass === 'e' ? 'elec' : 'phys');
  projectile.style.animation = (isPlayerAttacker ? 'flyToFoe' : 'flyToPlayer') + ' .4s forwards';

  setTimeout(() => {
    projectile.style.animation = '';
    // Animación de impacto en objetivo
    targetHolder.classList.remove('anim-hit');
    void targetHolder.offsetWidth;
    targetHolder.classList.add('anim-hit');

    // Floating Damage Text
    const pop = document.createElement('div');
    pop.className = 'damage-popup';
    pop.textContent = '-' + dmg;
    pop.style.left = isPlayerAttacker ? '70%' : '20%';
    pop.style.top = isPlayerAttacker ? '20%' : '60%';
    $('stage2d').appendChild(pop);
    setTimeout(() => pop.remove(), 850);
  }, 250);
}

function triggerEvoAnimation(isPlayer) {
  const holder = isPlayer ? $('holderPlayer') : $('holderFoe');
  holder.classList.remove('anim-evo');
  void holder.offsetWidth;
  holder.classList.add('anim-evo');
}

function can(a,who){
  if(!G||phase!=='game'||G.busy||G.over)return false;
  if(who!==null&&G.turn!==who)return false;
  const pl=G.pl[G.turn],t=pl.t,mo=cur();
  return a==='roll'?(!G.rolled||G.bonus)
       :a==='stone'?(pl.pts>=6&&t<4)
       :a==='evo'?(t>=2 && !!getNextEvo(mo.m))
       :a==='atk'?G.rolled&&t>=2
       :a==='sp'?G.rolled&&t>=4
       :a==='swap'?ben(G.turn).hp>0
       :a==='keep'?G.rolled:false;
}

function render(){
  update2dArena();
  const mo=cur(),mine=ME!==null&&G.turn===ME,nextEvo=getNextEvo(mo.m);
  $('banner').innerHTML=G.over?'¡Batalla Finalizada!':mine?`¡Es tu turno! (${mo.m.n})`:`Turno de ${nm(G.turn)} (${mo.m.n})`;
  $('atkBtn').textContent=`${mo.m.a1} (${mo.m.b} HP - 2★)`;
  $('spBtn').textContent=`${mo.m.a2} (${mo.m.s} HP - 4★)`;
  $('evoBtn').textContent=nextEvo?`Evolucionar a ${nextEvo.n} (2★)`:`Sin evolución`;

  ['roll','stone','evo','atk','sp','swap','keep'].forEach(a=>$(a+'Btn').disabled=!can(a,ME));
  $('die').textContent=G.die||'?';
  $('again').classList.toggle('hide',!G.over);
  $('log').innerHTML=G.log.slice(0,3).map(x=>`<div>${x}</div>`).join('');
  botThink();
}

const say=t=>G.log.unshift(t);

async function roll(){
  const d=rnd(),pl=G.pl[G.turn];
  G.die=d;play('roll');pl.pts+=d;
  let msg=`${nm(G.turn)} sacó un ${d}: suma ${d} pts (total: ${pl.pts}).`;
  if(d===6){play('six');if(G.extra<2){G.bonus=true;G.extra++;msg+=' ¡Tirada Extra!'}else G.bonus=false;}
  else G.bonus=false;
  say(msg);G.rolled=true;render();
}

async function hit(kind,t){
  const a=cur(),pl=G.pl[G.turn],f=foes(G.turn),k=f.includes(t)?t:f[0],d=act(k),sp=kind==='sp',dmg=sp?a.m.s:a.m.b;
  pl.t-=sp?4:2;
  say(`${nm(G.turn)} usa ${sp?a.m.a2:a.m.a1} e inflige ${dmg} de daño.`);
  
  triggerAttackAnimation(G.turn===(ME||0), a.m.cl, dmg);
  play(sp?'sp':'atk');
  
  d.hp=Math.max(0,d.hp-dmg);render();await wait(700);
  if(d.hp<=0){
    const b=ben(k);say(`${d.m.n} cayó debilitado.`);play('ko');
    if(b.hp>0){G.pl[k].a=1-G.pl[k].a;}
    else{G.pl[k].dead=true;say(`${nm(k)} ha sido eliminado.`);
      const lv=G.pl.map((p,j)=>p.dead?-1:j).filter(j=>j>=0);
      if(lv.length<=1){G.over=true;play('win');say(`¡Gana ${nm(lv[0])}!`);}
    }
  }
  render();
}

function swap(){
  const pl=G.pl[G.turn],old=cur();
  old.hp=Math.min(old.max,old.hp+15);
  pl.a=1-pl.a;
  say(`${nm(G.turn)} cambia a ${cur().m.n}. ${old.m.n} descansa y recupera 15 HP.`);
}

function evolve(){
  const pl=G.pl[G.turn],activeMon=cur(),nextEvo=getNextEvo(activeMon.m);
  if(!nextEvo||pl.t<2)return;
  pl.t-=2;
  activeMon.m=nextEvo;activeMon.max=nextEvo.hp;activeMon.hp=nextEvo.hp;
  triggerEvoAnimation(G.turn===(ME||0));
  play('evo');
  say(`✨ ¡${nm(G.turn)} evolucionó a ${nextEvo.n}!`);
}

function endTurn(){
  G.busy=false;
  if(!G.over){do{G.turn=(G.turn+1)%N}while(G.pl[G.turn].dead);G.rolled=false;G.bonus=false;G.extra=0;say(`Turno de ${nm(G.turn)}.`)}
  render();
}

const doRoll=async()=>{G.busy=true;render();await roll();G.busy=false;render()};
const doStone=()=>{const pl=G.pl[G.turn];pl.pts-=6;pl.t++;say(`${nm(G.turn)} canjea 1 Piedra de Energía.`);render()};
const doEvo=()=>{evolve();render()};
const doAtk=async t=>{G.busy=true;await hit('at',t);endTurn()};
const doSp=async t=>{G.busy=true;await hit('sp',t);endTurn()};
const doSwap=async()=>{G.busy=true;swap();render();await wait(500);endTurn()};
const doKeep=()=>{endTurn()};

function perform(a,i){
  if(a==='pick'){const k=nextPick(),c=P.pool[i];if(!c||c.o!==null)return;c.o=k;if(BOT&&k===0&&took(0)===2)botPick();if(NAMES.every((_,j)=>took(j)===2))reveal();else renderPick();return}
  if(a==='lead'){P.lead[0]=i;reveal();return}
  if(a==='ready'){P.ready[0]=true;if(BOT)P.ready[1]=true;if(P.ready.every(Boolean))startGame();else reveal();return}
  if(a==='again'){newPick();return}
  ({roll:doRoll,stone:doStone,evo:doEvo,atk:doAtk,sp:doSp,swap:doSwap,keep:doKeep})[a](i);
}

$('grid').onclick=e=>{const b=e.target.closest('button');if(b)perform('pick',+b.dataset.i)};
['roll','stone','evo','atk','sp','swap','keep'].forEach(a=>$(a+'Btn').onclick=()=>perform(a,tgt()));
$('rv').onclick=e=>{
  if(e.target.closest('#peekBtn')){rvPeek=true;reveal();return}
  const l=e.target.closest('[data-lead]');if(l){perform('lead',+l.dataset.lead);return}
  if(e.target.closest('#readyBtn'))perform('ready');
};
$('again').onclick=()=>perform('again');

// Compu IA Inteligente
function botPick(){P.pool.filter(c=>c.o===null).slice(0,2).forEach(c=>c.o=1);P.ready[1]=true}
function botThink(){if(!BOT||phase!=='game'||!G||G.over||G.turn!==1||G.busy||botPending)return;botPending=true;setTimeout(()=>{botPending=false;botAct()},900)}
function botAct(){
  if(!BOT||phase!=='game'||!G||G.over||G.turn!==1)return;
  const pl=G.pl[1],me=act(1),foe=act(0),canEvo=pl.t>=2&&getNextEvo(me.m);
  let a='keep';
  if(!G.rolled||G.bonus)a='roll';
  else if(pl.pts>=6&&pl.t<4)a='stone';
  else if(canEvo)a='evo';
  else if(pl.t>=4)a='sp';
  else if(pl.t>=2)a='atk';
  else if(ben(1).hp>me.hp)a='swap';
  perform(a,0);
}

// Inicialización de Menúes y Controles Basicos
$('localBtn').onclick=()=>{BOT=false;ME=null;setFmt();newPick()};
$('botBtn').onclick=()=>{BOT=true;ME=0;NAMES[1]='Compu';setFmt('ffa2');newPick()};
$('advBtn').onclick=()=>{BOT=true;ME=0;NAMES[1]='Líder Teo';setFmt('ffa2');newPick()};
$('menuBtn').onclick=()=>{phase='lobby';show('lobby')};
$('muteBtn').onclick=()=>{MUTE=!MUTE;$('muteBtn').textContent=MUTE?'🔇':'🔊'};

show('lobby');
